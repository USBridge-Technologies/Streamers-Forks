---
name: Release All Forks

# Builds Sunshine and Punktfunk together and publishes every platform's
# assets under ONE GitHub release/tag, instead of the two separate per-fork
# workflows (sunshine-release.yml, punktfunk-release.yml) each cutting their
# own release. That separation is exactly what broke usbridge_agent's build
# once before: GitHub's /releases/latest pointer follows whichever release
# was PUBLISHED most recently, with no regard for which fork it belongs to,
# so a Punktfunk-only release outranked the last Sunshine release and every
# macOS/Linux/Windows agent build silently fell back to a 10-30+ min
# Sunshine source build (USBridge-Remote's agent/scripts/fetch_sunshine.sh
# had to be hardened to scan the releases list for the newest release that
# actually carries the wanted asset, rather than trust /releases/latest, to
# recover from this). One shared tag for both forks' assets makes that
# class of bug impossible going forward, as long as releases keep coming
# from this workflow.
#
# The actual build logic lives in two reusable workflows,
# sunshine-build.yml and punktfunk-build.yml -- this file just dispatches
# both and creates the combined release. That split also keeps the Actions
# run graph readable: a called workflow renders as one collapsible node, so
# the graph shows "Sunshine Build" (3 platforms inside) and "Punktfunk
# Build" (2 platforms inside) converging into "release", instead of 5 flat
# top-level jobs with no visual grouping.
#
# Manual only, same reasoning as the two per-fork workflows: this repo holds
# several forks, so a tag push alone can't say what to release. Without a
# tag this is a combined build test and publishes nothing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2026.1010.usbridge); empty = build only, no release'
        required: false
      sunshine_platform:
        description: 'Sunshine: what to build'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - none
        default: all
      punktfunk_platform:
        description: 'Punktfunk: what to build'
        type: choice
        options:
          - all
          - linux
          - windows
          - none
        default: all

jobs:
  sunshine:
    name: Sunshine Build
    uses: ./.github/workflows/sunshine-build.yml
    with:
      tag: ${{ inputs.tag }}
      platform: ${{ inputs.sunshine_platform }}
    secrets: inherit

  punktfunk:
    name: Punktfunk Build
    uses: ./.github/workflows/punktfunk-build.yml
    with:
      platform: ${{ inputs.punktfunk_platform }}

  release:
    name: Create combined release
    needs: [sunshine, punktfunk]
    # A failed or cancelled build blocks the release; "skipped" can't
    # actually happen here (sunshine/punktfunk always run, their inner jobs
    # are what skip per-platform) but is kept for symmetry with the inner
    # workflows' own result checks. `always()` alone would let this run
    # even after both got cancelled outright -- check each dependency's own
    # result explicitly instead.
    if: >-
      ${{ always() && inputs.tag != '' &&
          (needs.sunshine.result == 'success' || needs.sunshine.result == 'skipped') &&
          (needs.punktfunk.result == 'success' || needs.punktfunk.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for scripts/sign_release_manifest.go below -- download-artifact
      # alone doesn't check out the repo's own source. Must run BEFORE
      # Download all artifacts: actions/checkout's default clean=true runs
      # `git clean -ffdx` first, which would otherwise delete the
      # just-downloaded artifacts/ directory right back out again.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Signs a manifest of every staged asset's SHA-256 with
      # USBridge-Remote's AGENT_UPDATE_ED25519_PRIVATE_KEY (this repo's own
      # copy of that secret -- see sign_release_manifest.go's own doc
      # comment for why it deliberately reuses that keypair instead of
      # minting a new one). agent/scripts/fetch_sunshine.sh verifies this
      # before trusting a downloaded asset's SHA-256, same tamper-evidence
      # pattern as itsme228/rust-shine's own release manifest.
      - name: Sign release manifest
        env:
          AGENT_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.AGENT_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          go run scripts/sign_release_manifest.go \
            -version "${{ inputs.tag }}" -dir artifacts \
            -manifest-out artifacts/manifest.json \
            -sig-out artifacts/manifest.json.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Streamers ${{ inputs.tag }} (Sunshine + Punktfunk, usbridge forks)"
          body: |
            Combined release of both usbridge streamer forks under one tag, so
            agent/scripts/fetch_sunshine.sh (and any future punktfunk fetch
            script) always finds a release that carries every asset it needs,
            regardless of which fork's release happened to publish last.

            Sunshine fork: `web_bind_address` config option, USB devices handed
            to the USBridge USB broker (a tablet sent over the stream; gamepads
            on Windows). macOS build is Developer-ID-signed and notarized.

            Punktfunk fork: USB devices handed to the USBridge USB broker, and
            PyroWave on the GameStream plane for a USBridge client. Linux
            x86_64 (host + encode worker, NVENC + Vulkan encode) and Windows
            x64 (punktfunk-host.exe, NVENC + QSV + AMF; no installer or
            drivers). No macOS build.
          files: |
            artifacts/Sunshine-macOS-arm64.dmg
            artifacts/Sunshine-Windows-x86_64-portable.zip
            artifacts/Sunshine-Linux-x86_64.tar.gz
            artifacts/punktfunk-host-Linux-x86_64.tar.gz
            artifacts/punktfunk-host-Windows-x64.zip
            artifacts/manifest.json
            artifacts/manifest.json.sig
          fail_on_unmatched_files: false
