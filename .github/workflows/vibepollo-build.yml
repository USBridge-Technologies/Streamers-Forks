---
name: Vibepollo Build

# Called by release-all.yml. Builds the Vibepollo fork in vibepollo/ (Nonary/Vibepollo plus the
# USBridge changes: the USB broker bridge, web_bind_address, the client's cursor setting) into
# the portable zip the USBridge agent downloads: Vibepollo-Windows-x86_64-portable.zip, all
# files under one top directory, sunshine.exe at its root.
#
# Linux: Vibepollo-Linux-x86_64.tar.gz, the cmake install tree (usr/bin/vibepollo,
# usr/share/vibepollo) with every non-system library bundled by linuxdeploy, built on Ubuntu
# 22.04 like the Sunshine tarball, so it runs on any distro with glibc 2.35 or newer -- not
# just the Arch packages upstream publishes. libva stays the host's (driver ABI). No NVIDIA
# TrueHDR: its pinned runtime (cuDNN, NPP, VFX) is several hundred MB.
#
# What is left out: the WebRTC build (libwebrtc is a separate multi-hour build, the agent's
# clients use GameStream), the Playnite .NET plugin, the virtual display driver and its
# tooling (the agent installs MttVDD, the display driver every USBridge streamer shares;
# Vibepollo runs with virtual_display_mode = disabled), the tests and the docs.

on:
  workflow_call:
    inputs:
      platform:
        description: 'all, linux, windows, or none'
        required: true
        type: string

jobs:
  linux:
    name: Linux x86_64
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    defaults:
      run:
        working-directory: vibepollo
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Upstream's own dependency step (gcc 14 from the toolchain PPA, cmake, the CUDA 12.9
      # runfile into build/cuda), as its AppImage CI runs it on 22.04. libva comes from the
      # host at run time, so only its headers are built here, the latest release, as upstream.
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo add-apt-repository universe -y
          sudo apt-get update -qq
          sudo apt-get install -y libdrm-dev libgl-dev libwayland-dev libx11-xcb-dev \
            libxcb-dri3-dev libxfixes-dev
          chmod +x scripts/linux_build.sh
          ./scripts/linux_build.sh --step=deps --appimage-build --ubuntu-test-repo --skip-cleanup

      - name: Build latest libva
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download --archive=tar.gz --repo=intel/libva
          tar xzf libva-*.tar.gz && rm libva-*.tar.gz
          cd libva-*
          ./autogen.sh --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu \
            --enable-drm --enable-x11 --enable-glx --enable-wayland --without-legacy
          make -j "$(nproc)"
          sudo make install
          cd .. && rm -rf libva-*

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          # As on Windows: the fork carries no upstream tags.
          export BUILD_VERSION="2.0.1+usbridge.$(git rev-parse --short HEAD)"
          nvcc="$(pwd)/build/cuda/bin/nvcc"
          test -x "$nvcc"
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTS=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_WERROR=OFF \
            -DSUNSHINE_BUILD_APPIMAGE=ON \
            -DSUNSHINE_ASSETS_DIR=share/vibepollo \
            -DSUNSHINE_EXECUTABLE_PATH=/usr/bin/vibepollo \
            -DSUNSHINE_ENABLE_DRM=ON \
            -DSUNSHINE_ENABLE_KWIN=ON \
            -DSUNSHINE_ENABLE_PORTAL=ON \
            -DSUNSHINE_ENABLE_WAYLAND=ON \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_ENABLE_WEBRTC=OFF \
            -DSUNSHINE_ENABLE_NV_TRUEHDR=OFF \
            -DSUNSHINE_ENABLE_CUDA=ON \
            -DSUNSHINE_REQUIRE_CUDA_PASCAL=ON \
            -DCMAKE_CUDA_COMPILER:PATH="$nvcc" \
            -DCMAKE_CUDA_HOST_COMPILER=gcc-14 \
            -DSUNSHINE_PUBLISHER_NAME="usbridge_agent" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/itsme228/usbridge_agent" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/itsme228/usbridge_agent/issues"

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      # The layout the agent expects (forkrelease.PrepareVibepollo on Linux): usr/bin/vibepollo
      # and usr/share/vibepollo at the root of the tarball, its libraries in usr/lib.
      - name: Install to staging and package tarball
        run: |
          set -euo pipefail
          rm -rf build/cuda
          DESTDIR="$(pwd)/staging" cmake --install build
          test -x staging/usr/bin/vibepollo

          curl -fL --progress-bar -o /tmp/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x /tmp/linuxdeploy-x86_64.AppImage

          desktop_file="$(find staging/usr/share/applications -name '*.desktop' | head -1)"
          icon_file="$(find staging/usr/share/icons -name '*.svg' -o -name '*.png' | head -1)"
          ARCH=x86_64 /tmp/linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir staging \
            --executable staging/usr/bin/vibepollo \
            ${icon_file:+--icon-file "$icon_file"} \
            ${desktop_file:+--desktop-file "$desktop_file"} \
            --exclude-library="libva.so*" \
            --exclude-library="libva-drm.so*" \
            --exclude-library="libva-x11.so*" \
            --exclude-library="libva-wayland.so*"

          missing_libs="$(ldd staging/usr/bin/vibepollo 2>/dev/null | awk '/not found/ {print $1}' | grep -v '^libva' || true)"
          if [[ -n "$missing_libs" ]]; then
            echo "::error::vibepollo still misses shared libraries after bundling: $missing_libs"
            exit 1
          fi

          mkdir -p artifacts
          tar -czf artifacts/Vibepollo-Linux-x86_64.tar.gz -C staging .
          ls -la artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibepollo-Linux-x86_64.tar.gz
          path: vibepollo/artifacts/Vibepollo-Linux-x86_64.tar.gz

  windows:
    name: Windows x86_64
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    defaults:
      run:
        working-directory: vibepollo
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-tools

      - name: Configure
        shell: msys2 {0}
        run: |
          set -o pipefail
          git config --global --add safe.directory '*'
          # The fork carries no upstream tags, so version resolution would land on 0.0.0, which
          # Vibepollo's cmake refuses for a release build. Pin the upstream release the snapshot
          # follows, with the commit as build metadata.
          export BUILD_VERSION="2.0.1+usbridge.$(git rev-parse --short HEAD)"
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_SUNSHINE_VIRTUAL_DISPLAY_DRIVER=OFF \
            -DBUILD_VIRTUALDISPLAY_PROBE=OFF \
            -DBUILD_VIRTUALDISPLAY_TOOLS=OFF \
            -DBUILD_VIRTUALDISPLAY_VULKAN_LAYER=OFF \
            -DSUNSHINE_ENABLE_WEBRTC=OFF \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="usbridge_agent" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/itsme228/usbridge_agent" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/itsme228/usbridge_agent/issues"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --target sunshine --parallel "$(nproc)"

      # The layout the agent expects (forkrelease.PrepareVibepollo): sunshine.exe at the root of
      # the single top directory, with assets\ and tools\ beside it and every non-system DLL the
      # exe imports from MSYS2.
      - name: Package ZIP
        shell: msys2 {0}
        run: |
          set -euo pipefail
          out=artifacts/Vibepollo
          mkdir -p "$out/tools"
          cp build/sunshine.exe "$out/"
          cp -r build/assets "$out/assets"
          for f in sunshine_display_helper.exe vibepollo_dualsense_haptics.exe vibepollo_dualsense_audio.dll; do
            [ -f "build/tools/$f" ] && cp "build/tools/$f" "$out/tools/"
          done
          ldd build/sunshine.exe | awk '/ucrt64/ {print $3}' | sort -u | while read -r dll; do
            cp "$dll" "$out/"
          done
          test -f "$out/sunshine.exe"
          ( cd artifacts && zip -qr Vibepollo-Windows-x86_64-portable.zip Vibepollo )
          ls -la artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibepollo-Windows-x86_64-portable.zip
          path: vibepollo/artifacts/Vibepollo-Windows-x86_64-portable.zip
