---
name: Sunshine Build

# Called by release-all.yml (and reusable from sunshine-release.yml later if
# that one ever gets folded in too). Splitting Sunshine's 3 platform builds
# into their own reusable workflow — rather than 3 top-level jobs in
# release-all.yml — makes the Actions run graph group them under one
# "Sunshine Build" node instead of scattering macOS/Windows/Linux flat
# alongside Punktfunk's own jobs.
#
# macOS signing/notarization: same 5 secrets as itsme228/rust-shine's
# release-usbridge-streamer.yml (APPLE_ID, APPLE_TEAM_ID,
# BUILD_CERTIFICATE_BASE64, P12_PASSWORD, NOTARIZATION_PASSWORD), this
# repo's own copies of the values. Signing itself is driven by the fork's
# own existing CMake hooks (cmake/packaging/macos.cmake's
# APPLE_CODESIGN_IDENTITY cache var + SHOULD_SIGN env, already upstream in
# LizardByte/Sunshine). Only runs when `tag` is set — a plain build-test
# dispatch stays ad-hoc signed and skips notarization, so test runs don't
# burn Apple's notarization quota. No single-entry `strategy.matrix` here:
# there's exactly one macOS target (arm64), so a matrix just adds a nesting
# level to the run graph for no reason.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag being built; empty = build only (stays ad-hoc signed, no notarization)'
        required: false
        type: string
      platform:
        description: 'all, linux, windows, macos, or none'
        required: true
        type: string
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      NOTARIZATION_PASSWORD:
        required: false

jobs:
  macos:
    name: macOS arm64
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    defaults:
      run:
        working-directory: sunshine
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Import macOS signing certificate into a temporary keychain
        if: inputs.tag != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/sunshine-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Select Xcode 16.2
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app

      - name: Install dependencies
        run: |
          brew install --quiet \
            cmake \
            node \
            pkgconf \
            icu4c@78 \
            miniupnpc \
            openssl@3 \
            opus

      - name: Configure
        run: |
          cmake \
            -B build \
            -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DICU_ROOT="$(brew --prefix icu4c@78)" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DOpus_ROOT_DIR="$(brew --prefix opus)" \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_PUBLISHER_NAME="usbridge_agent" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/itsme228/usbridge_agent" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/itsme228/usbridge_agent/issues"

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      # No -DAPPLE_CODESIGN_IDENTITY/SHOULD_SIGN here -- cpack's own
      # install(CODE) signing hook (cmake/packaging/macos.cmake) signs too
      # early in its own packaging sequence: something installs/touches
      # Contents/Resources/assets/web/*.json AFTER that script signs the
      # bundle, which invalidates the resource seal ("a sealed resource is
      # missing or invalid", confirmed live and reproduced locally with the
      # real cert). cpack here just produces an (effectively unsigned)
      # staging DMG; we sign for real in the next step, after cpack is
      # completely done touching the bundle.
      - name: Package DMG
        run: |
          cd build
          cpack -G DragNDrop --config CPackConfig.cmake
          mkdir -p ../artifacts
          cp cpack_artifacts/Sunshine.dmg ../artifacts/Sunshine-macOS-arm64.dmg

      - name: Sign, verify, and re-package the DMG
        if: inputs.tag != ''
        run: |
          set -euo pipefail
          SRC_DMG="artifacts/Sunshine-macOS-arm64.dmg"
          STAGE="$(mktemp -d)"
          MOUNT_POINT="$(mktemp -d)"
          cleanup() { hdiutil detach -quiet "$MOUNT_POINT" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          echo "y" | hdiutil attach -nobrowse -mountpoint "$MOUNT_POINT" "$SRC_DMG" >/dev/null
          APP_NAME="$(basename "$(find "$MOUNT_POINT" -maxdepth 1 -iname "*.app" | head -1)")"
          if [[ -z "$APP_NAME" ]]; then
            echo "::error::no .app found inside the built DMG"
            exit 1
          fi
          cp -R "$MOUNT_POINT/$APP_NAME" "$STAGE/$APP_NAME"
          cleanup
          trap - EXIT

          APP="$STAGE/$APP_NAME"
          codesign --force --deep --sign "Developer ID Application" \
            --options runtime --entitlements src_assets/macos/entitlements.plist \
            --timestamp "$APP"

          echo "== codesign -dv =="
          if ! CODESIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"; then
            echo "$CODESIGN_INFO"
            echo "::error::Sunshine.app is not signed or the signature is invalid"
            exit 1
          fi
          echo "$CODESIGN_INFO"
          if echo "$CODESIGN_INFO" | grep -q "^Signature=adhoc"; then
            echo "::error::Sunshine.app is ad-hoc signed -- check BUILD_CERTIFICATE_BASE64/P12_PASSWORD repo secrets"
            exit 1
          fi
          if ! echo "$CODESIGN_INFO" | grep -q "Authority=Developer ID Application"; then
            echo "::error::Authority=Developer ID Application not found in signature -- wrong cert imported"
            exit 1
          fi
          echo "== codesign --verify --deep --strict =="
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✓ Sunshine.app is signed with a real Developer ID Application identity."

          # Re-package: a plain DMG, no Finder drag-layout/background --
          # this artifact is consumed programmatically by
          # agent/scripts/fetch_sunshine.sh, never double-clicked by a user.
          ln -sf /Applications "$STAGE/Applications"
          rm -f "$SRC_DMG"
          hdiutil create -volname Sunshine -srcfolder "$STAGE" -ov -format UDZO "$SRC_DMG"

      - name: Notarize DMG
        if: inputs.tag != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          set -euo pipefail
          dmg="artifacts/Sunshine-macOS-arm64.dmg"

          submit_json="$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" --output-format json --wait --timeout 15m)"
          echo "$submit_json"
          status="$(echo "$submit_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [ "$status" != "Accepted" ]; then
            id="$(echo "$submit_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARIZATION_PASSWORD" 2>/dev/null || true
            echo "::error::Notarization did not succeed (status: $status)"
            exit 1
          fi

          xcrun stapler staple -v "$dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-macOS-arm64.dmg
          path: sunshine/artifacts/Sunshine-macOS-arm64.dmg

      - name: Remove temporary keychain
        if: always() && inputs.tag != ''
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"

  windows:
    name: Windows x86_64
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    defaults:
      run:
        working-directory: sunshine
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-toolchain

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake \
            -B build \
            -S . \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_PUBLISHER_NAME="usbridge_agent" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/itsme228/usbridge_agent" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/itsme228/usbridge_agent/issues"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j "$(nproc)"

      - name: Package ZIP
        shell: msys2 {0}
        run: |
          cd build
          cpack -G ZIP --config CPackConfig.cmake
          mkdir -p ../artifacts
          cp cpack_artifacts/Sunshine.zip ../artifacts/Sunshine-Windows-x86_64-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-Windows-x86_64-portable.zip
          path: sunshine/artifacts/Sunshine-Windows-x86_64-portable.zip

  linux:
    name: Linux x86_64
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    defaults:
      run:
        working-directory: sunshine
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake 4.x from Kitware
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/kitware.gpg >/dev/null
          sudo apt-add-repository -y \
            "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main"
          sudo apt-get update -qq
          sudo apt-get install -y cmake

      - name: Install build dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 g++-14 pkg-config nodejs npm \
            libssl-dev libevdev-dev libopus-dev libpulse-dev \
            libcurl4-openssl-dev libgbm-dev libnuma-dev \
            libpipewire-0.3-dev libsystemd-dev libnotify-dev \
            libx11-dev libxrandr-dev libxfixes-dev libxtst-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libxcb1-dev \
            libdrm-dev libcap-dev libudev-dev libwayland-dev \
            libminiupnpc-dev libva-dev libvulkan-dev \
            qtbase5-dev libqt5svg5-dev glslang-tools

      - name: Install CUDA toolkit
        env:
          CUDA_VERSION: "12.9.1"
          CUDA_BUILD: "575.57.08"
        run: |
          url="https://developer.download.nvidia.com/compute/cuda/${CUDA_VERSION}/local_installers/cuda_${CUDA_VERSION}_${CUDA_BUILD}_linux.run"
          wget -q --max-redirect=0 -O "$RUNNER_TEMP/cuda.run" "$url"
          sudo sh "$RUNNER_TEMP/cuda.run" --silent --toolkit --toolkitpath="$RUNNER_TEMP/cuda" \
            --no-opengl-libs --no-man-page --no-drm
          rm -f "$RUNNER_TEMP/cuda.run"
          "$RUNNER_TEMP/cuda/bin/nvcc" --version

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_BUILD_APPIMAGE=ON \
            -DSUNSHINE_ENABLE_CUDA=ON \
            -DSUNSHINE_ENABLE_VULKAN=OFF \
            -DCUDA_FAIL_ON_MISSING=ON \
            -DCMAKE_CUDA_COMPILER:PATH="$RUNNER_TEMP/cuda/bin/nvcc" \
            -DCMAKE_CUDA_HOST_COMPILER=g++-14 \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_PUBLISHER_NAME="usbridge_agent" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/itsme228/usbridge_agent" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/itsme228/usbridge_agent/issues"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Verify CUDA support was compiled in
        run: |
          grep -q "SUNSHINE_BUILD_CUDA" build/CMakeFiles/sunshine.dir/flags.make
          find build -name 'cuda.cu.o' | grep -q .
          echo "CUDA path compiled into sunshine"

      - name: Verify Vulkan encoder was left out
        run: |
          if grep -q "SUNSHINE_BUILD_VULKAN" build/CMakeFiles/sunshine.dir/flags.make; then
            echo "::error::Vulkan encoder must not be built (it segfaults on stream start)"
            exit 1
          fi

      - name: Install to staging and package tarball
        run: |
          DESTDIR=staging cmake --install build --prefix /usr

          curl -fL --progress-bar -o /tmp/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x /tmp/linuxdeploy-x86_64.AppImage

          desktop_file="$(find staging/usr/share/applications -name '*.desktop' | head -1)"

          ARCH=x86_64 /tmp/linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir staging \
            --executable staging/usr/bin/sunshine \
            --icon-file sunshine.png \
            --desktop-file "$desktop_file" \
            --exclude-library="libva.so*" \
            --exclude-library="libva-drm.so*"

          missing_libs="$(ldd staging/usr/bin/sunshine 2>/dev/null | awk '/not found/ {print $1}')"
          if [[ -n "$missing_libs" ]]; then
            echo "::error::sunshine binary still missing shared libraries after bundling: $missing_libs"
            exit 1
          fi

          mkdir -p artifacts
          tar -czf artifacts/Sunshine-Linux-x86_64.tar.gz -C staging .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-Linux-x86_64.tar.gz
          path: sunshine/artifacts/Sunshine-Linux-x86_64.tar.gz
