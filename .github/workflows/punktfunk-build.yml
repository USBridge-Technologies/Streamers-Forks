---
name: Punktfunk Build

# Called by release-all.yml. Split out from release-all.yml's job list into
# its own reusable workflow for the same reason as sunshine-build.yml: the
# Actions run graph groups a called workflow's jobs under one "Punktfunk
# Build" node instead of scattering them flat alongside Sunshine's own jobs.
# No macOS build (Linux/Windows only), and neither platform signs its binary
# (matching rust-shine's own release workflow, which also ships
# usbridge-streamer-windows-x86_64.zip unsigned).

on:
  workflow_call:
    inputs:
      platform:
        description: 'all, linux, windows, or none'
        required: true
        type: string

jobs:
  linux:
    name: Linux x86_64
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    defaults:
      run:
        working-directory: punktfunk
    # 22.04 so the binaries need only glibc 2.34 and run on Ubuntu 22.04,
    # Debian 12 and RHEL 10 like the rest of USBridge, not just 24.04+.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        # The libspa/pipewire crates need pipewire >= 0.3.65 headers; 22.04
        # ships 0.3.48, so they come from the pipewire-upstream PPA. Only the
        # headers matter: every pw_/spa_ symbol the host imports exists in
        # 22.04's stock libpipewire 0.3.48, checked with ldd -r.
        run: |
          sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config cmake git \
            libdrm-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libgl-dev libegl-dev libgbm-dev libvulkan-dev

      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: punktfunk
          # The key ignores the runner image; a 24.04 cache would bring
          # back pipewire bindings generated from other headers.
          key: ubuntu-22.04-pipewire-ppa

      - name: Build host and encode worker
        run: |
          cargo build --release --locked \
            --features punktfunk-host/nvenc,punktfunk-host/vulkan-encode \
            -p punktfunk-host -p punktfunk-encode-worker

      - name: Verify NVENC was compiled in
        run: |
          strings target/release/punktfunk-host | grep -qE "NvEncodeAPICreateInstance|libnvidia-encode"
          echo "NVENC path compiled into punktfunk-host"

      - name: Package tarball
        run: |
          mkdir -p artifacts
          ./target/release/punktfunk-host --version | tee artifacts/VERSION
          tar -czf artifacts/punktfunk-host-Linux-x86_64.tar.gz \
            -C target/release punktfunk-host punktfunk-encode-worker

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: punktfunk-host-Linux-x86_64.tar.gz
          path: punktfunk/artifacts/punktfunk-host-Linux-x86_64.tar.gz

  windows:
    name: Windows x64
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    defaults:
      run:
        working-directory: punktfunk
        shell: pwsh
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\t
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE) { rustup toolchain install }
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: punktfunk -> C:\t

      - name: Build host
        run: |
          cargo build --release --locked -p punktfunk-host --features nvenc,qsv --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "host build" }

      # Streams a monitor the host did not create (a pinned physical one): the host
      # starts it beside itself and fails every such session without it.
      - name: Build capture worker
        run: |
          cargo build --release --locked -p punktfunk-capture-worker --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "capture worker build" }

      - name: Package zip
        run: |
          $dir = "C:\t\x86_64-pc-windows-msvc\release"
          $exe = "$dir\punktfunk-host.exe"
          $worker = "$dir\punktfunk-capture-worker.exe"
          & $exe --version
          if (-not (Test-Path $worker)) { throw "punktfunk-capture-worker.exe missing" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path $exe, $worker -DestinationPath artifacts/punktfunk-host-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: punktfunk-host-Windows-x64.zip
          path: punktfunk/artifacts/punktfunk-host-Windows-x64.zip
